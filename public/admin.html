<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Axiom Admin Dashboard — Manage public development sites and geo-fence zones.">
  <title>Admin Dashboard — Axiom</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-name">◎ Axiom</span>
        </div>
        <span class="role-badge admin">Admin</span>
      </div>

      <div class="sidebar-content">
        <!-- Add / Edit Form -->
        <div id="site-form-section">
          <div class="section-title" id="form-title">Add New Site</div>

          <form id="site-form">
            <input type="hidden" id="edit-id" value="">

            <div class="form-group">
              <label for="site-name">Project Name</label>
              <input type="text" id="site-name" placeholder="e.g. City Hospital Wing B" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="site-type">Type</label>
                <select id="site-type">
                  <option value="Hospital">Hospital</option>
                  <option value="College">College</option>
                  <option value="Road">Road</option>
                  <option value="Bridge">Bridge</option>
                  <option value="Railway">Railway</option>
                  <option value="Water Supply">Water Supply</option>
                  <option value="Park">Park</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="site-status">Status</label>
                <select id="site-status">
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="site-desc">Description & Civic Impact</label>
              <textarea id="site-desc" placeholder="Describe the work and its impact on the community..."></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="site-lat">Latitude</label>
                <input type="number" id="site-lat" step="any" placeholder="Click map" required>
              </div>
              <div class="form-group">
                <label for="site-lng">Longitude</label>
                <input type="number" id="site-lng" step="any" placeholder="Click map" required>
              </div>
            </div>

            <div class="form-group">
              <label for="site-radius">Geo-fence Radius (meters)</label>
              <input type="number" id="site-radius" value="500" min="50" max="5000">
            </div>

            <div class="btn-row" id="form-buttons">
              <button type="submit" class="btn btn-primary" id="submit-btn">Add Site</button>
            </div>
          </form>
        </div>

        <!-- Existing Sites List -->
        <div class="section-title" style="margin-top: 1.5rem;">Existing Sites</div>
        <div id="site-list" class="site-list">
          <div class="empty-state" id="empty-state">
            <span>📍</span>
            <p>No sites yet. Click the map to add one.</p>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <a href="/">← Back to Home</a>
      </div>
    </aside>

    <!-- Map -->
    <div class="map-container">
      <div class="map-overlay-msg" id="map-msg">📍 Click on the map to set coordinates</div>
      <div id="map"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
